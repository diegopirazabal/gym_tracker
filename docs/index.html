<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
  <title>Hypertrophy Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Sticky Top Header -->
    <header class="top-bar">
      <div class="top-bar-row">
        <div class="brand">
          <span class="brand-dot" id="conn-dot" aria-hidden="true"></span>
          <h1 class="brand-title" id="header-title">Entrenar</h1>
          <span class="mode-pill hidden" id="demo-pill">DEMO</span>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-refresh" aria-label="Actualizar datos" title="Sincronizar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-settings" aria-label="Configuración" title="Configuración">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Offline / Pending Queue Banner -->
      <div id="sync-banner" class="sync-banner hidden" role="status">
        <span id="sync-banner-text"></span>
        <button type="button" class="banner-action" id="btn-flush-queue">Sincronizar</button>
      </div>

      <!-- Day Selector (visible on Entrenar tab) -->
      <nav id="day-selector" class="day-pills" aria-label="Días de entrenamiento"></nav>
    </header>

    <!-- Main Scrollable Content -->
    <main id="main-content" class="main-content">
      <section id="view-train" class="view"></section>
      <section id="view-week" class="view hidden"></section>
    </main>

    <!-- Sticky Action Footer (visible on Entrenar tab) -->
    <div id="train-footer" class="train-footer">
      <div class="train-summary">
        <span class="summary-sets" id="summary-sets">0 / 0 series</span>
        <span class="summary-tonnage" id="summary-tonnage">0 kg</span>
      </div>
      <button type="button" class="btn-primary" id="btn-finish-session" disabled>
        Finalizar y guardar sesión
      </button>
    </div>

    <!-- Bottom 2-Tab Navigation Bar -->
    <nav class="tab-bar" aria-label="Navegación principal">
      <button type="button" class="tab-btn active" data-tab="train" id="tab-train">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11" />
          <path d="M6.5 17.5h11" />
          <path d="M4 10v4" />
          <path d="M20 10v4" />
          <path d="M7 7v10" />
          <path d="M17 7v10" />
          <path d="M2 11v2" />
          <path d="M22 11v2" />
        </svg>
        <span>Entrenar</span>
      </button>
      <button type="button" class="tab-btn" data-tab="week" id="tab-week">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
          <path d="M8 14h.01" />
          <path d="M12 14h.01" />
          <path d="M16 14h.01" />
          <path d="M8 18h.01" />
          <path d="M12 18h.01" />
        </svg>
        <span>Semana</span>
      </button>
    </nav>
  </div>

  <!-- Modal Layer (Setup / Save Confirmation / Duplicate Prompt) -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-card" class="modal-card"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
